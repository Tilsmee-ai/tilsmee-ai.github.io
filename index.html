<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TILSMEE V8 Watchface · Master 1.1.0</title>
  <link rel="stylesheet" href="watchface.css">
</head>
<body>
<main class="stage">
  <section class="watch" id="watch">
    <div class="second-ring" id="secondRing" aria-hidden="true"></div>

    <div class="brain-module">
      <button class="brain-shell" id="brainButton" type="button" aria-label="TILSMEE aktivieren">
        <img class="brain-master" src="tilsmee-brain-master.png" alt="TILSMEE Gehirn">
        <span class="brain-core-pulse" aria-hidden="true"></span>
      </button>
    </div>

    
    <div class="brain-message" id="brainMessage" aria-live="polite">
      Wie kann ich dir helfen?
    </div>

    <div class="weather top-info">
      <svg viewBox="0 0 90 65" aria-hidden="true">
        <circle class="sun" cx="59" cy="19" r="10"/>
        <path class="ray" d="M59 1v9M59 28v9M41 19h9M68 19h9M46 6l6 6M66 26l6 6M72 6l-6 6"/>
        <path class="cloud" d="M19 54h49a13 13 0 0 0 0-26h-2A20 20 0 0 0 29 31a15 15 0 0 0-10 23z"/>
      </svg>
      <span id="temperature">24°C</span>
    </div>

    <div class="battery top-info">
      <svg viewBox="0 0 100 55" aria-hidden="true">
        <rect x="8" y="7" width="78" height="41" rx="5"/>
        <rect x="88" y="18" width="6" height="18" rx="2"/>
        <path d="M20 18h54M20 27.5h54M20 37h54"/>
      </svg>
      <span id="batteryValue">100%</span>
    </div>

    <div class="time-row">
      <span id="time">10:09</span><span class="seconds" id="seconds">36</span>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="date-row">
      <span id="weekday">FREITAG</span>
      <strong id="day">15</strong>
      <span id="monthYear">MAI 2025</span>
    </div>

    <div class="metrics">
      <div class="metric">
        <svg class="metric-icon steps-icon" viewBox="0 0 64 64" aria-hidden="true">
          <g transform="rotate(-18 32 32)">
            <ellipse cx="22" cy="19" rx="8" ry="13"/><circle cx="14" cy="8" r="3"/><circle cx="20" cy="5" r="3"/><circle cx="26" cy="6" r="3"/>
            <ellipse cx="43" cy="42" rx="8" ry="13"/><circle cx="36" cy="30" r="3"/><circle cx="42" cy="28" r="3"/><circle cx="48" cy="30" r="3"/>
          </g>
        </svg>
        <div><strong id="steps">8753</strong><small>SCHRITTE</small></div>
      </div>
      <div class="metric">
        <svg class="metric-icon heart-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 54C11 39 6 30 8 20 10 7 27 5 32 17 37 5 54 7 56 20c2 10-3 19-24 34z"/></svg>
        <div><strong id="pulse">72</strong><small>PULS</small></div>
      </div>
      <div class="metric">
        <svg class="metric-icon fire-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M34 5c4 13-8 16-2 28 2-8 9-10 10-19 11 10 16 20 12 31-4 11-14 16-24 14C16 57 8 48 10 36c2-10 10-16 17-25-1 10 2 14 7 17 3-8-3-13 0-23z"/></svg>
        <div><strong id="kcal">456</strong><small>KCAL</small></div>
      </div>
    </div>

    <div class="brand">
      <div class="wordmark"><span class="tils">TILS</span><span class="mee">MEE</span></div>
      <div class="tagline"><i></i><span>DEIN KOMPETENTER KI-ASSISTENT</span><i></i></div>
    </div>

    <div class="circuit" aria-hidden="true">
      <svg viewBox="0 0 720 180" preserveAspectRatio="none">
        <g id="circuitLines"></g>
      </svg>
    </div>
  </section>
</main>
<script src="watchface.js"></script>
</body>
</html>
